# Base theme: see ../README.md for the palette

# Font
font_family MesloLGM Nerd Font
font_size   10.5

# Window
window_padding_width    6
# Lets switch-theme.sh change the opacity of open windows
dynamic_background_opacity yes
confirm_os_window_close 0
enable_audio_bell       no

# Cursor
cursor_blink_interval 0

# Tabs
tab_bar_edge          top
tab_bar_style         separator
tab_separator         ""
tab_title_template    " {index} {title} "
active_tab_foreground   #111111
active_tab_background   #73daca
active_tab_font_style   bold
inactive_tab_foreground #737373
inactive_tab_background #111111
tab_bar_background      #111111

# Colours: neutral greys, green, blue and yellow accents
foreground           #e6e6e6
background           #161616
selection_foreground none
selection_background #3d3d3d
cursor               #73daca
url_color            #7aa2f7
active_border_color   #73daca
inactive_border_color #303030
mark1_background     #a6c8ff
mark2_background     #73daca
mark3_background     #7dcfff

color0  #262626
color8  #595959
color1  #f7768e
color9  #ff8ba0
color2  #9ece6a
color10 #b3e07f
color3  #ecd06f
color11 #f5de8a
color4  #7aa2f7
color12 #94b6ff
color5  #bb9af7
color13 #cbb0ff
color6  #73daca
color14 #8eeedb
