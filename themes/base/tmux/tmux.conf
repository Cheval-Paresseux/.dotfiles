# Base theme: see ../README.md for the palette

# General
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 10
set -g focus-events on
set -g set-titles on
set -g set-titles-string "#S: #W"

# Terminal
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-kitty:RGB,*256col*:RGB"

# Splits and new windows keep the current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# Status bar
set -g status-position top
set -g status-interval 30
set -g status-style "bg=#111111,fg=#a6a6a6"
set -g status-left "#[bold,fg=#111111,bg=#73daca] #S #[default] "
set -g status-left-length 30
set -g status-right "#[fg=#737373]%a %d %b #[fg=#e6e6e6,bold]%H:%M "
set -g status-right-length 30

setw -g window-status-format " #I #W "
setw -g window-status-style "fg=#737373"
setw -g window-status-current-format " #I #W "
setw -g window-status-current-style "bold,fg=#73daca,bg=#262626"
setw -g window-status-activity-style "fg=#ecd06f"
setw -g window-status-bell-style "fg=#f7768e"
setw -g window-status-separator ""

# Panes
set -g pane-border-style "fg=#303030"
set -g pane-active-border-style "fg=#73daca"
set -g display-panes-colour "#595959"
set -g display-panes-active-colour "#73daca"

# Messages and modes
set -g message-style "bg=#262626,fg=#e6e6e6"
set -g message-command-style "bg=#262626,fg=#73daca"
setw -g mode-style "bg=#3d3d3d,fg=#e6e6e6"
setw -g clock-mode-colour "#73daca"
