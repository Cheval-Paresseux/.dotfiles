# Eddie theme: see ../README.md for the palette

# Font
font_family MesloLGM Nerd Font
font_size   10.5

# Window: opaque, like waxed cotton
window_padding_width    10
# Lets switch-theme.sh change the opacity of open windows
dynamic_background_opacity yes
confirm_os_window_close 0
enable_audio_bell       no

# Cursor
cursor_blink_interval 0

# Tabs: set apart by a fleur-de-lis, the current one in the hunting coat's scarlet
tab_bar_edge          top
tab_bar_style         separator
tab_separator         "  ⚜  "
tab_title_template    " {index} {title} "
active_tab_foreground   #f3ead2
active_tab_background   #c8432c
active_tab_font_style   bold
inactive_tab_foreground #776e5a
inactive_tab_background #15130e
inactive_tab_font_style normal
tab_bar_background      #15130e
tab_bar_margin_height   4 4

# Colours: loden and oak darks, oatmeal text, hunting scarlet, and the overchecks of a tweed
foreground           #e8dfc5
background           #15130e
selection_foreground none
selection_background #3a352a
cursor               #c8432c
cursor_text_color    #f3ead2
url_color            #7f9cb0
active_border_color   #c8432c
inactive_border_color #2d2921
mark1_background     #7f9cb0
mark2_background     #d0a443
mark3_background     #9b85ad

color0  #23201a
color8  #554e3f
color1  #a63a55
