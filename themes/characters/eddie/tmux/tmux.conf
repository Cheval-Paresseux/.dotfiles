# Eddie theme: see ../README.md for the palette

# General
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 10
set -g focus-events on
set -g set-titles on
set -g set-titles-string "#S: #W"

# Terminal
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-kitty:RGB,*256col*:RGB"

# Splits and new windows keep the current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# Status bar: the session on a scarlet label, windows set apart by a fleur-de-lis
set -g status-position top
set -g status-interval 30
set -g status-style "bg=#100f0b,fg=#a39a80"
set -g status-left "#[fg=#f3ead2,bg=#c8432c,bold] #S #[default]  "
set -g status-left-length 30
set -g status-right "#[fg=#776e5a,italics]%A %d %B #[fg=#8c6a45,noitalics]⚜ #[fg=#e8dfc5,bold]%H:%M "
set -g status-right-length 40

setw -g window-status-format "#[fg=#776e5a]#I #W"
setw -g window-status-current-format "#[fg=#c8432c,bold]#I #W"
setw -g window-status-activity-style "fg=#d0a443"
setw -g window-status-bell-style "fg=#a63a55"
setw -g window-status-separator "#[fg=#8c6a45]  ⚜  "

# Panes
set -g pane-border-style "fg=#2d2921"
set -g pane-active-border-style "fg=#c8432c"
set -g pane-border-lines heavy
set -g display-panes-colour "#554e3f"
set -g display-panes-active-colour "#c8432c"

# Messages and modes
set -g message-style "bg=#23201a,fg=#e8dfc5"
set -g message-command-style "bg=#23201a,fg=#c8432c"
setw -g mode-style "bg=#3a352a,fg=#e8dfc5"
setw -g clock-mode-colour "#c8432c"
