# Eddie theme: see ../README.md for the palette

# General
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 10
set -g focus-events on
set -g set-titles on
set -g set-titles-string "#S: #W"

# Terminal
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-kitty:RGB,*256col*:RGB"

# Splits and new windows keep the current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# Status bar: the session on a gold label, windows separated by gilt fleurons
set -g status-position top
set -g status-interval 30
set -g status-style "bg=#0a0d0b,fg=#9a9f94"
set -g status-left "#[fg=#0a0d0b,bg=#c8a96a,bold] #S #[fg=#c8a96a,bg=#0a0d0b,nobold]#[default]  "
set -g status-left-length 30
set -g status-right "#[fg=#66716a,italics]%A %d %B #[fg=#7d6535,noitalics]❦ #[fg=#e3cf9c,bold]%H:%M "
set -g status-right-length 40

setw -g window-status-format "#[fg=#66716a]#I #W"
setw -g window-status-current-format "#[fg=#c8a96a,bold,italics]#I #W"
setw -g window-status-activity-style "fg=#c98a4b"
setw -g window-status-bell-style "fg=#b24a4f"
setw -g window-status-separator "#[fg=#45524a]  ❦  "

# Panes
set -g pane-border-style "fg=#1f2a23"
set -g pane-active-border-style "fg=#c8a96a"
set -g pane-border-lines heavy
set -g display-panes-colour "#45524a"
set -g display-panes-active-colour "#c8a96a"

# Messages and modes
set -g message-style "bg=#18201b,fg=#e4dcc8"
set -g message-command-style "bg=#18201b,fg=#c8a96a"
setw -g mode-style "bg=#2a372e,fg=#e4dcc8"
setw -g clock-mode-colour "#c8a96a"
