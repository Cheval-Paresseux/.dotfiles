# Eddie theme: bottle-green darks, ivory text, antique gold focus (see ../README.md)

[mgr]
cwd = { fg = "#c8a96a", bold = true }
find_keyword = { fg = "#c98a4b", bold = true }
find_position = { fg = "#66716a" }
hovered = { bg = "#1f2a23" }
hovered_file = { fg = "#e4dcc8", bg = "#1f2a23", bold = true }
preview_hovered = { bg = "#1f2a23" }
marker_copied = { fg = "#88a878", bg = "#88a878" }
marker_cut = { fg = "#b24a4f", bg = "#b24a4f" }
marker_marked = { fg = "#8b9cab", bg = "#8b9cab" }
marker_selected = { fg = "#c8a96a", bg = "#c8a96a" }
count_copied = { fg = "#0a0d0b", bg = "#88a878" }
count_cut = { fg = "#0a0d0b", bg = "#b24a4f" }
count_selected = { fg = "#0a0d0b", bg = "#c8a96a" }
border_symbol = "┃"
border_style = { fg = "#1f2a23" }

[indicator]
parent = { fg = "#9a9f94", bg = "#18201b" }
current = { fg = "#0a0d0b", bg = "#c8a96a" }
preview = { fg = "#9a9f94", bg = "#18201b" }

[tabs]
active = { fg = "#0a0d0b", bg = "#c8a96a", bold = true }
inactive = { fg = "#66716a", bg = "#0a0d0b" }

[mode]
normal_main = { fg = "#0a0d0b", bg = "#c8a96a", bold = true }
normal_alt = { fg = "#c8a96a", bg = "#18201b" }
select_main = { fg = "#0a0d0b", bg = "#8b9cab", bold = true }
select_alt = { fg = "#8b9cab", bg = "#18201b" }
unset_main = { fg = "#0a0d0b", bg = "#b24a4f", bold = true }
unset_alt = { fg = "#b24a4f", bg = "#18201b" }

[status]
overall = { fg = "#9a9f94" }
perm_type = { fg = "#8b9cab" }
perm_read = { fg = "#e3cf9c" }
perm_write = { fg = "#b24a4f" }
perm_exec = { fg = "#88a878" }
perm_sep = { fg = "#45524a" }
progress_label = { fg = "#e4dcc8", bold = true }
progress_normal = { fg = "#c8a96a", bg = "#18201b" }
progress_error = { fg = "#b24a4f", bg = "#18201b" }

[which]
mask = { bg = "#121815" }
cand = { fg = "#c8a96a" }
rest = { fg = "#66716a" }
desc = { fg = "#c2bfae" }
separator_style = { fg = "#45524a" }

[confirm]
border = { fg = "#c8a96a" }
title = { fg = "#c8a96a", bold = true }
body = { fg = "#c2bfae" }
btn_yes = { fg = "#0a0d0b", bg = "#c8a96a", bold = true }
btn_no = { fg = "#e4dcc8", bg = "#1f2a23" }

[input]
border = { fg = "#c8a96a" }
title = { fg = "#c8a96a", bold = true }
value = { fg = "#e4dcc8" }
selected = { bg = "#2a372e" }

[pick]
border = { fg = "#c8a96a" }
active = { fg = "#c8a96a", bg = "#1f2a23", bold = true }
inactive = { fg = "#c2bfae" }

[cmp]
border = { fg = "#2a372e" }
active = { fg = "#e4dcc8", bg = "#1f2a23" }
inactive = { fg = "#9a9f94" }

[tasks]
border = { fg = "#c8a96a" }
title = { fg = "#c8a96a", bold = true }
hovered = { fg = "#e4dcc8", bg = "#1f2a23" }

[help]
on = { fg = "#c8a96a" }
run = { fg = "#8b9cab" }
desc = { fg = "#9a9f94" }
hovered = { bg = "#1f2a23", bold = true }
footer = { fg = "#e4dcc8", bg = "#18201b" }

[notify]
title_info = { fg = "#8b9cab" }
title_warn = { fg = "#c98a4b" }
title_error = { fg = "#b24a4f" }

[filetype]
rules = [
	{ mime = "image/*", fg = "#e3cf9c" },
	{ mime = "{audio,video}/*", fg = "#9c7f9a" },
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#c98a4b" },
	{ mime = "application/{pdf,doc,rtf}", fg = "#6f9a8e" },
	{ mime = "inode/empty", fg = "#45524a" },
	{ url = "*", is = "orphan", fg = "#b24a4f" },
	{ url = "*", is = "exec", fg = "#88a878" },
	{ url = "*/", fg = "#8b9cab", bold = true },
	{ url = "*", fg = "#e4dcc8" },
]
