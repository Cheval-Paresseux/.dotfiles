# Eddie theme: loden and oak darks, oatmeal text, hunting scarlet for focus (see ../README.md)

[mgr]
cwd = { fg = "#c8432c", bold = true }
find_keyword = { fg = "#d0a443", bold = true }
find_position = { fg = "#776e5a" }
hovered = { bg = "#2d2921" }
hovered_file = { fg = "#e8dfc5", bg = "#2d2921", bold = true }
preview_hovered = { bg = "#2d2921" }
marker_copied = { fg = "#8ea35a", bg = "#8ea35a" }
marker_cut = { fg = "#a63a55", bg = "#a63a55" }
marker_marked = { fg = "#7f9cb0", bg = "#7f9cb0" }
marker_selected = { fg = "#c8432c", bg = "#c8432c" }
count_copied = { fg = "#100f0b", bg = "#8ea35a" }
count_cut = { fg = "#f3ead2", bg = "#a63a55" }
count_selected = { fg = "#f3ead2", bg = "#c8432c" }
border_symbol = "┃"
border_style = { fg = "#2d2921" }

[indicator]
parent = { fg = "#a39a80", bg = "#23201a" }
current = { fg = "#f3ead2", bg = "#c8432c" }
preview = { fg = "#a39a80", bg = "#23201a" }

[tabs]
active = { fg = "#f3ead2", bg = "#c8432c", bold = true }
inactive = { fg = "#776e5a", bg = "#100f0b" }

[mode]
normal_main = { fg = "#f3ead2", bg = "#c8432c", bold = true }
normal_alt = { fg = "#c8432c", bg = "#23201a" }
select_main = { fg = "#100f0b", bg = "#7f9cb0", bold = true }
select_alt = { fg = "#7f9cb0", bg = "#23201a" }
unset_main = { fg = "#f3ead2", bg = "#a63a55", bold = true }
unset_alt = { fg = "#a63a55", bg = "#23201a" }

[status]
overall = { fg = "#a39a80" }
perm_type = { fg = "#7f9cb0" }
perm_read = { fg = "#e2bf6c" }
perm_write = { fg = "#a63a55" }
perm_exec = { fg = "#8ea35a" }
perm_sep = { fg = "#554e3f" }
progress_label = { fg = "#e8dfc5", bold = true }
progress_normal = { fg = "#c8432c", bg = "#23201a" }
progress_error = { fg = "#a63a55", bg = "#23201a" }

[which]
mask = { bg = "#1b1913" }
cand = { fg = "#c8432c" }
rest = { fg = "#776e5a" }
desc = { fg = "#c7bea2" }
separator_style = { fg = "#554e3f" }

[confirm]
border = { fg = "#c8432c" }
title = { fg = "#c8432c", bold = true }
body = { fg = "#c7bea2" }
btn_yes = { fg = "#f3ead2", bg = "#c8432c", bold = true }
btn_no = { fg = "#e8dfc5", bg = "#2d2921" }

[input]
border = { fg = "#c8432c" }
title = { fg = "#c8432c", bold = true }
value = { fg = "#e8dfc5" }
selected = { bg = "#3a352a" }

[pick]
border = { fg = "#c8432c" }
active = { fg = "#c8432c", bg = "#2d2921", bold = true }
inactive = { fg = "#c7bea2" }

[cmp]
border = { fg = "#3a352a" }
active = { fg = "#e8dfc5", bg = "#2d2921" }
inactive = { fg = "#a39a80" }

[tasks]
border = { fg = "#c8432c" }
title = { fg = "#c8432c", bold = true }
hovered = { fg = "#e8dfc5", bg = "#2d2921" }

[help]
on = { fg = "#c8432c" }
run = { fg = "#7f9cb0" }
desc = { fg = "#a39a80" }
hovered = { bg = "#2d2921", bold = true }
footer = { fg = "#e8dfc5", bg = "#23201a" }

[notify]
title_info = { fg = "#7f9cb0" }
title_warn = { fg = "#d0a443" }
title_error = { fg = "#a63a55" }

[filetype]
rules = [
	{ mime = "image/*", fg = "#b5865a" },
	{ mime = "{audio,video}/*", fg = "#9b85ad" },
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#d0a443" },
	{ mime = "application/{pdf,doc,rtf}", fg = "#6e9f92" },
	{ mime = "inode/empty", fg = "#554e3f" },
	{ url = "*", is = "orphan", fg = "#a63a55" },
	{ url = "*", is = "exec", fg = "#8ea35a" },
	{ url = "*/", fg = "#7f9cb0", bold = true },
	{ url = "*", fg = "#e8dfc5" },
]
