# Mugen theme: see ../README.md for the palette

# Font
font_family MesloLGM Nerd Font
font_size   10.5

# Window: opaque paper
window_padding_width    8
# Lets switch-theme.sh change the opacity of open windows
dynamic_background_opacity yes
confirm_os_window_close 0
enable_audio_bell       no

# Cursor: a quick flick of the blade
cursor_blink_interval 0
cursor_trail          1
cursor_trail_decay    0.02 0.12

# Tabs: cut on a slant, the current one in the sun's red
tab_bar_edge          top
tab_bar_style         slant
tab_title_template    " {index} {title} "
active_tab_foreground   #ffffff
active_tab_background   #d23a1e
active_tab_font_style   bold
inactive_tab_foreground #5c544a
inactive_tab_background #e3dccd
tab_bar_background      #e9e3d7

# Colours: washi paper and sumi ink, the sun's vermilion, and the old dyes.
# A light theme: the ANSI colours are dark enough to read on paper, and "white" is a pale grey.
foreground           #1e1a17
background           #f5f1e8
selection_foreground none
selection_background #ecc9b8
cursor               #d23a1e
cursor_text_color    #ffffff
url_color            #2e5a88
active_border_color   #d23a1e
inactive_border_color #c6bca8
mark1_background     #b9cde3
mark2_background     #ecc9b8
mark3_background     #d6e3c4

color0  #3f3932
color8  #7b7163
