# Mugen theme: see ../README.md for the palette

# General
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 10
set -g focus-events on
set -g set-titles on
set -g set-titles-string "#S: #W"

# Terminal
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-kitty:RGB,*256col*:RGB"

# Splits and new windows keep the current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# Status bar: paper, the session in a red block, windows set apart by sword cuts
set -g status-position top
set -g status-interval 30
set -g status-style "bg=#e9e3d7,fg=#5c544a"
set -g status-left "#[bold,fg=#ffffff,bg=#d23a1e] #S #[default] "
set -g status-left-length 30
set -g status-right "#[fg=#7b7163]%a %d %b #[fg=#1e1a17,bold]%H:%M "
set -g status-right-length 30

setw -g window-status-format " #I #W "
setw -g window-status-style "fg=#7b7163"
setw -g window-status-current-format " #I #W "
setw -g window-status-current-style "bold,fg=#ffffff,bg=#d23a1e"
setw -g window-status-activity-style "fg=#a8740f"
setw -g window-status-bell-style "fg=#9c1730"
setw -g window-status-separator "#[fg=#d23a1e]╱"

# Panes
set -g pane-border-style "fg=#d8cfbd"
set -g pane-active-border-style "fg=#d23a1e"
set -g display-panes-colour "#9c917f"
set -g display-panes-active-colour "#d23a1e"

# Messages and modes
set -g message-style "bg=#e3dccd,fg=#1e1a17"
set -g message-command-style "bg=#e3dccd,fg=#d23a1e"
setw -g mode-style "bg=#c6bca8,fg=#1e1a17"
setw -g clock-mode-colour "#d23a1e"
