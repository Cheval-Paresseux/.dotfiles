# Quinn theme: see ../README.md for the palette

# Font
font_family MesloLGM Nerd Font
font_size   10.5

# Window
window_padding_width    10
background_opacity      0.88
# Lets switch-theme.sh change the opacity of open windows
dynamic_background_opacity yes
confirm_os_window_close 0
enable_audio_bell       no

# Cursor
cursor_blink_interval 0

# Tabs: slanted like a cut of lingerie, the current one in neon
tab_bar_edge          top
tab_bar_style         powerline
tab_powerline_style   slanted
tab_title_template    " {index} {title} "
active_tab_foreground   #0b0709
active_tab_background   #f03c96
active_tab_font_style   bold
inactive_tab_foreground #7d5868
inactive_tab_background #1f1219
inactive_tab_font_style italic
tab_bar_background      #100a0d

# Colours: black with a wine tint, skin-warm text, neon magenta; red, amber and green are the safeword lights
foreground           #f2e4e6
background           #100a0d
selection_foreground none
selection_background #3a2130
cursor               #f03c96
cursor_text_color    #0b0709
url_color            #4fc3d9
active_border_color   #f03c96
inactive_border_color #2a1822
mark1_background     #4fc3d9
mark2_background     #f03c96
mark3_background     #9b7cf2

color0  #1f1219
color8  #5c3a4b
color1  #ff4b3a
color9  #ff7a6b
color2  #6fd08c
color10 #95e0aa
color3  #f2a541
color11 #f7c27a
color4  #9b7cf2
color12 #b8a2f7
color5  #f03c96
color13 #f7a8c8
color6  #4fc3d9
color14 #82d8e8
color7  #d4b8c0
