# Coruscant theme: see ../README.md for the palette

# General
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 10
set -g focus-events on
set -g set-titles on
set -g set-titles-string "#S: #W"

# Terminal
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-kitty:RGB,*256col*:RGB"

# Splits and new windows keep the current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# Status bar
set -g status-position top
set -g status-interval 30
set -g status-style "bg=#07080c,fg=#a8a49b"
set -g status-left "#[bold,fg=#07080c,bg=#d8b26e] #S #[default] "
set -g status-left-length 30
set -g status-right "#[fg=#656b7c]%a %d %b #[fg=#ece6d8,bold]%H:%M "
set -g status-right-length 30

setw -g window-status-format " #I #W "
setw -g window-status-style "fg=#656b7c"
setw -g window-status-current-format " #I #W "
setw -g window-status-current-style "bold,fg=#d8b26e,bg=#161a24"
setw -g window-status-activity-style "fg=#e39a55"
setw -g window-status-bell-style "fg=#d9506a"
setw -g window-status-separator ""

# Panes
set -g pane-border-style "fg=#1e2330"
set -g pane-active-border-style "fg=#d8b26e"
set -g display-panes-colour "#474d5e"
set -g display-panes-active-colour "#d8b26e"

# Messages and modes
set -g message-style "bg=#161a24,fg=#ece6d8"
set -g message-command-style "bg=#161a24,fg=#d8b26e"
setw -g mode-style "bg=#2a3040,fg=#ece6d8"
setw -g clock-mode-colour "#d8b26e"
