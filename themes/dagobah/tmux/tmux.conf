# Dagobah theme: see ../README.md for the palette

# General
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 10
set -g focus-events on
set -g set-titles on
set -g set-titles-string "#S: #W"

# Terminal
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-kitty:RGB,*256col*:RGB"

# Splits and new windows keep the current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# Status bar
set -g status-position top
set -g status-interval 30
set -g status-style "bg=#0a1110,fg=#90a79e"
set -g status-left "#[bold,fg=#0a1110,bg=#6cb6ff] #S #[default] "
set -g status-left-length 30
set -g status-right "#[fg=#607a71]%a %d %b #[fg=#dbe6dc,bold]%H:%M "
set -g status-right-length 30

setw -g window-status-format " #I #W "
setw -g window-status-style "fg=#607a71"
setw -g window-status-current-format " #I #W "
setw -g window-status-current-style "bold,fg=#6cb6ff,bg=#1a2824"
setw -g window-status-activity-style "fg=#e8c15d"
setw -g window-status-bell-style "fg=#e0735a"
setw -g window-status-separator ""

# Panes
set -g pane-border-style "fg=#22332e"
set -g pane-active-border-style "fg=#6cb6ff"
set -g display-panes-colour "#476058"
set -g display-panes-active-colour "#6cb6ff"

# Messages and modes
set -g message-style "bg=#1a2824,fg=#dbe6dc"
set -g message-command-style "bg=#1a2824,fg=#6cb6ff"
setw -g mode-style "bg=#2c403a,fg=#dbe6dc"
setw -g clock-mode-colour "#6cb6ff"
