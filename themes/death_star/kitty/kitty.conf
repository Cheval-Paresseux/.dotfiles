# Death Star theme: see ../README.md for the palette

# Font
font_family MesloLGM Nerd Font
font_size   10.5

# Window
window_padding_width    6
# Lets switch-theme.sh change the opacity of open windows
dynamic_background_opacity yes
confirm_os_window_close 0
enable_audio_bell       no

# Cursor: a short trail, like a saber swing
cursor_blink_interval 0
cursor_trail          2
cursor_trail_decay    0.05 0.2

# Tabs: slanted like the bridge viewports
tab_bar_edge          top
tab_bar_style         powerline
tab_powerline_style   slanted
tab_title_template    " {index} {title} "
active_tab_foreground   #08090b
active_tab_background   #e32b36
active_tab_font_style   bold
inactive_tab_foreground #676e79
inactive_tab_background #1b1e23
tab_bar_background      #08090b

# Colours: gunmetal greys, saber red, imperial blue, alarm amber, Force-lightning violet
foreground           #dfe2e6
background           #0d0f12
selection_foreground none
selection_background #30353d
cursor               #e32b36
cursor_text_color    #08090b
url_color            #73a7d9
active_border_color   #e32b36
inactive_border_color #24282e
mark1_background     #73a7d9
mark2_background     #e32b36
mark3_background     #6fc3c9

color0  #1b1e23
color8  #4b515b
color1  #e32b36
color9  #f04d57
color2  #84c26a
color10 #9dd685
