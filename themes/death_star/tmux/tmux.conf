# Death Star theme: see ../README.md for the palette

# General
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 10
set -g focus-events on
set -g set-titles on
set -g set-titles-string "#S: #W"

# Terminal
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-kitty:RGB,*256col*:RGB"

# Splits and new windows keep the current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# Status bar
set -g status-position top
set -g status-interval 30
set -g status-style "bg=#08090b,fg=#9399a3"
set -g status-left "#[bold,fg=#08090b,bg=#e32b36] #S #[default] "
set -g status-left-length 30
set -g status-right "#[fg=#676e79]%a %d %b #[fg=#dfe2e6,bold]%H:%M "
set -g status-right-length 30

setw -g window-status-format " #I #W "
setw -g window-status-style "fg=#676e79"
setw -g window-status-current-format " #I #W "
setw -g window-status-current-style "bold,fg=#e32b36,bg=#1b1e23"
setw -g window-status-activity-style "fg=#f2b134"
setw -g window-status-bell-style "fg=#b18cff"
setw -g window-status-separator ""

# Panes
set -g pane-border-style "fg=#24282e"
set -g pane-active-border-style "fg=#e32b36"
set -g display-panes-colour "#4b515b"
set -g display-panes-active-colour "#e32b36"

# Messages and modes
set -g message-style "bg=#1b1e23,fg=#dfe2e6"
set -g message-command-style "bg=#1b1e23,fg=#e32b36"
setw -g mode-style "bg=#30353d,fg=#dfe2e6"
setw -g clock-mode-colour "#e32b36"
