# Hoth theme: see ../README.md for the palette

# Font
font_family MesloLGM Nerd Font
font_size   10.5

# Window: frosted ice, blurred by Hyprland
window_padding_width    8
background_opacity      0.85
# Lets switch-theme.sh change the opacity of open windows
dynamic_background_opacity yes
confirm_os_window_close 0
enable_audio_bell       no

# Cursor: a short trail, like snow blown off a ridge
cursor_blink_interval 0
cursor_trail          2
cursor_trail_decay    0.05 0.25

# Tabs: angled like ice shards
tab_bar_edge          top
tab_bar_style         powerline
tab_title_template    " {index} {title} "
active_tab_foreground   #ffffff
active_tab_background   #d9581f
active_tab_font_style   bold
inactive_tab_foreground #536478
inactive_tab_background #dce4ec
tab_bar_background      #e3eaf1

# Colours: snow and slate, Rebel orange, Luke's blue, Vader's red.
# A light theme: the ANSI colours are darkened to read on snow, and "white" is a pale grey.
foreground           #1f2a37
background           #f4f7fa
selection_foreground none
selection_background #c9d8ea
cursor               #d9581f
cursor_text_color    #ffffff
url_color            #2f73c0
active_border_color   #d9581f
inactive_border_color #bccad8
mark1_background     #a9c8ec
mark2_background     #f3b99c
mark3_background     #a8d5d8

color0  #3d4c5e
color8  #718296
color1  #c42f3a
color9  #d94a53
color2  #3f8a3a
color10 #4f9e48
color3  #a87b00
color11 #c08f0a
