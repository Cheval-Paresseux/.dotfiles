# Hoth theme: see ../README.md for the palette

# General
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 10
set -g focus-events on
set -g set-titles on
set -g set-titles-string "#S: #W"

# Terminal
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-kitty:RGB,*256col*:RGB"

# Splits and new windows keep the current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# Status bar
set -g status-position top
set -g status-interval 30
set -g status-style "bg=#e3eaf1,fg=#536478"
set -g status-left "#[bold,fg=#ffffff,bg=#d9581f] #S #[default] "
set -g status-left-length 30
set -g status-right "#[fg=#718296]%a %d %b #[fg=#1f2a37,bold]%H:%M "
set -g status-right-length 30

setw -g window-status-format " #I #W "
setw -g window-status-style "fg=#718296"
setw -g window-status-current-format " #I #W "
setw -g window-status-current-style "bold,fg=#d9581f,bg=#dce4ec"
setw -g window-status-activity-style "fg=#a87b00"
setw -g window-status-bell-style "fg=#c42f3a"
setw -g window-status-separator ""

# Panes
set -g pane-border-style "fg=#cfd9e3"
set -g pane-active-border-style "fg=#d9581f"
set -g display-panes-colour "#91a1b3"
set -g display-panes-active-colour "#d9581f"

# Messages and modes
set -g message-style "bg=#dce4ec,fg=#1f2a37"
set -g message-command-style "bg=#dce4ec,fg=#d9581f"
setw -g mode-style "bg=#bccad8,fg=#1f2a37"
setw -g clock-mode-colour "#d9581f"
