# Hoth theme: snow and slate, Rebel orange focus (see ../README.md)

[mgr]
cwd = { fg = "#d9581f", bold = true }
find_keyword = { fg = "#a87b00", bold = true }
find_position = { fg = "#718296" }
hovered = { bg = "#cfd9e3" }
hovered_file = { fg = "#1f2a37", bg = "#cfd9e3", bold = true }
preview_hovered = { bg = "#cfd9e3" }
marker_copied = { fg = "#3f8a3a", bg = "#3f8a3a" }
marker_cut = { fg = "#c42f3a", bg = "#c42f3a" }
marker_marked = { fg = "#2f73c0", bg = "#2f73c0" }
marker_selected = { fg = "#d9581f", bg = "#d9581f" }
count_copied = { fg = "#ffffff", bg = "#3f8a3a" }
count_cut = { fg = "#ffffff", bg = "#c42f3a" }
count_selected = { fg = "#ffffff", bg = "#d9581f" }
border_symbol = "│"
border_style = { fg = "#cfd9e3" }

[indicator]
parent = { fg = "#536478", bg = "#dce4ec" }
current = { fg = "#ffffff", bg = "#d9581f" }
preview = { fg = "#536478", bg = "#dce4ec" }

[tabs]
active = { fg = "#ffffff", bg = "#d9581f", bold = true }
inactive = { fg = "#718296", bg = "#e3eaf1" }

[mode]
normal_main = { fg = "#ffffff", bg = "#d9581f", bold = true }
normal_alt = { fg = "#d9581f", bg = "#dce4ec" }
select_main = { fg = "#ffffff", bg = "#2f73c0", bold = true }
select_alt = { fg = "#2f73c0", bg = "#dce4ec" }
unset_main = { fg = "#ffffff", bg = "#c42f3a", bold = true }
unset_alt = { fg = "#c42f3a", bg = "#dce4ec" }

[status]
overall = { fg = "#536478" }
perm_type = { fg = "#2f73c0" }
perm_read = { fg = "#a87b00" }
perm_write = { fg = "#c42f3a" }
perm_exec = { fg = "#3f8a3a" }
perm_sep = { fg = "#91a1b3" }
progress_label = { fg = "#1f2a37", bold = true }
progress_normal = { fg = "#d9581f", bg = "#dce4ec" }
progress_error = { fg = "#c42f3a", bg = "#dce4ec" }

[which]
mask = { bg = "#ebf0f5" }
cand = { fg = "#d9581f" }
rest = { fg = "#718296" }
desc = { fg = "#3d4c5e" }
separator_style = { fg = "#91a1b3" }

[confirm]
border = { fg = "#d9581f" }
title = { fg = "#d9581f", bold = true }
body = { fg = "#3d4c5e" }
btn_yes = { fg = "#ffffff", bg = "#d9581f", bold = true }
btn_no = { fg = "#1f2a37", bg = "#cfd9e3" }

[input]
border = { fg = "#d9581f" }
title = { fg = "#d9581f", bold = true }
value = { fg = "#1f2a37" }
selected = { bg = "#bccad8" }

[pick]
border = { fg = "#d9581f" }
active = { fg = "#d9581f", bg = "#cfd9e3", bold = true }
inactive = { fg = "#3d4c5e" }

[cmp]
border = { fg = "#bccad8" }
active = { fg = "#1f2a37", bg = "#cfd9e3" }
inactive = { fg = "#536478" }

[tasks]
border = { fg = "#d9581f" }
title = { fg = "#d9581f", bold = true }
hovered = { fg = "#1f2a37", bg = "#cfd9e3" }

[help]
on = { fg = "#d9581f" }
run = { fg = "#2f73c0" }
desc = { fg = "#536478" }
hovered = { bg = "#cfd9e3", bold = true }
footer = { fg = "#1f2a37", bg = "#dce4ec" }

[notify]
title_info = { fg = "#2f73c0" }
title_warn = { fg = "#a87b00" }
title_error = { fg = "#c42f3a" }

[filetype]
rules = [
	{ mime = "image/*", fg = "#1c7f86" },
	{ mime = "{audio,video}/*", fg = "#7550b0" },
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#a87b00" },
	{ mime = "application/{pdf,doc,rtf}", fg = "#546a82" },
	{ mime = "inode/empty", fg = "#91a1b3" },
	{ url = "*", is = "orphan", fg = "#c42f3a" },
	{ url = "*", is = "exec", fg = "#3f8a3a" },
	{ url = "*/", fg = "#2f73c0", bold = true },
	{ url = "*", fg = "#1f2a37" },
]
