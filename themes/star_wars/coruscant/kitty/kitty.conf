# Coruscant theme: see ../README.md for the palette

# Font
font_family MesloLGM Nerd Font
font_size   10.5

# Window: champagne-tinted glass, blurred by Hyprland
window_padding_width    8
background_opacity      0.88
# Lets switch-theme.sh change the opacity of open windows
dynamic_background_opacity yes
confirm_os_window_close 0
enable_audio_bell       no

# Cursor: a short gold streak, like an air taxi between towers
cursor_blink_interval 0
cursor_trail          2
cursor_trail_decay    0.05 0.2

# Tabs: quiet labels set apart by gold diamonds; the active one in gold
tab_bar_edge          top
tab_bar_style         separator
tab_separator         " ◆ "
tab_title_template    " {index} {title} "
active_tab_title_template " {index} {title.upper()} "
active_tab_foreground   #d8b26e
active_tab_background   #0b0d13
active_tab_font_style   bold
inactive_tab_foreground #656b7c
inactive_tab_background #0b0d13
tab_bar_background      #0b0d13

# Colours: onyx navy and ivory, champagne gold, jewel tones (emerald and ruby keep the market's meaning)
foreground           #ece6d8
background           #0b0d13
selection_foreground none
selection_background #2a3040
cursor               #d8b26e
cursor_text_color    #07080c
url_color            #7ea6e0
active_border_color   #d8b26e
inactive_border_color #1e2330
mark1_background     #7ea6e0
mark2_background     #d8b26e
mark3_background     #a68bd8

color0  #161a24
color8  #474d5e
