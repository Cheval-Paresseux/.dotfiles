# Dagobah theme: see ../README.md for the palette

# Font: hand-drawn letters, a little crooked like the swamp
font_family FantasqueSansM Nerd Font
font_size   11.5

# Window: wet glass, blurred by Hyprland
window_padding_width    8
background_opacity      0.82
# Lets switch-theme.sh change the opacity of open windows
dynamic_background_opacity yes
confirm_os_window_close 0
enable_audio_bell       no

# Cursor: drifts like a firefly
cursor_blink_interval 0
cursor_trail          3

# Tabs
tab_bar_edge          top
tab_bar_style         powerline
tab_powerline_style   round
tab_title_template    " {index} {title} "
active_tab_foreground   #0a1110
active_tab_background   #6cb6ff
active_tab_font_style   bold
inactive_tab_foreground #607a71
inactive_tab_background #1a2824
tab_bar_background      #0a1110

# Colours: swamp greens, saber blue, moss, lantern and ember
foreground           #dbe6dc
background           #0e1715
selection_foreground none
selection_background #2c403a
cursor               #6cb6ff
cursor_text_color    #0a1110
url_color            #7cc4b8
active_border_color   #6cb6ff
inactive_border_color #22332e
mark1_background     #7cc4b8
mark2_background     #6cb6ff
mark3_background     #c8d67a

color0  #1a2824
color8  #476058
