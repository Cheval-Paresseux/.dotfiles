# Tatooine theme: dusk browns, sand and twin-sun accents (see ../README.md)

[mgr]
cwd = { fg = "#f2a65a", bold = true }
find_keyword = { fg = "#f5cf73", bold = true }
find_position = { fg = "#8c7663" }
hovered = { bg = "#372b21" }
hovered_file = { fg = "#eedfc4", bg = "#372b21", bold = true }
preview_hovered = { bg = "#372b21" }
marker_copied = { fg = "#a9b665", bg = "#a9b665" }
marker_cut = { fg = "#e5533d", bg = "#e5533d" }
marker_marked = { fg = "#7fb4b5", bg = "#7fb4b5" }
marker_selected = { fg = "#f2a65a", bg = "#f2a65a" }
count_copied = { fg = "#130e0a", bg = "#a9b665" }
count_cut = { fg = "#130e0a", bg = "#e5533d" }
count_selected = { fg = "#130e0a", bg = "#f2a65a" }
border_symbol = "│"
border_style = { fg = "#372b21" }

[indicator]
parent = { fg = "#b9a58d", bg = "#2b221a" }
current = { fg = "#130e0a", bg = "#f2a65a" }
preview = { fg = "#b9a58d", bg = "#2b221a" }

[tabs]
active = { fg = "#130e0a", bg = "#f2a65a", bold = true }
inactive = { fg = "#8c7663", bg = "#130e0a" }

[mode]
normal_main = { fg = "#130e0a", bg = "#f2a65a", bold = true }
normal_alt = { fg = "#f2a65a", bg = "#2b221a" }
select_main = { fg = "#130e0a", bg = "#7fb4b5", bold = true }
select_alt = { fg = "#7fb4b5", bg = "#2b221a" }
unset_main = { fg = "#130e0a", bg = "#e5533d", bold = true }
unset_alt = { fg = "#e5533d", bg = "#2b221a" }

[status]
overall = { fg = "#b9a58d" }
perm_type = { fg = "#7fb4b5" }
perm_read = { fg = "#f5cf73" }
perm_write = { fg = "#e5533d" }
perm_exec = { fg = "#a9b665" }
perm_sep = { fg = "#6e5b49" }
progress_label = { fg = "#eedfc4", bold = true }
progress_normal = { fg = "#f2a65a", bg = "#2b221a" }
progress_error = { fg = "#e5533d", bg = "#2b221a" }

[which]
mask = { bg = "#1f1812" }
cand = { fg = "#f2a65a" }
rest = { fg = "#8c7663" }
desc = { fg = "#d3c1a5" }
separator_style = { fg = "#6e5b49" }

[confirm]
border = { fg = "#f2a65a" }
title = { fg = "#f2a65a", bold = true }
body = { fg = "#d3c1a5" }
btn_yes = { fg = "#130e0a", bg = "#f2a65a", bold = true }
btn_no = { fg = "#eedfc4", bg = "#372b21" }

[input]
border = { fg = "#f2a65a" }
title = { fg = "#f2a65a", bold = true }
value = { fg = "#eedfc4" }
selected = { bg = "#47382b" }

[pick]
border = { fg = "#f2a65a" }
active = { fg = "#f2a65a", bg = "#372b21", bold = true }
inactive = { fg = "#d3c1a5" }

[cmp]
border = { fg = "#47382b" }
active = { fg = "#eedfc4", bg = "#372b21" }
inactive = { fg = "#b9a58d" }

[tasks]
border = { fg = "#f2a65a" }
title = { fg = "#f2a65a", bold = true }
hovered = { fg = "#eedfc4", bg = "#372b21" }

[help]
on = { fg = "#f2a65a" }
run = { fg = "#7fb4b5" }
desc = { fg = "#b9a58d" }
hovered = { bg = "#372b21", bold = true }
footer = { fg = "#eedfc4", bg = "#2b221a" }

[notify]
title_info = { fg = "#7fb4b5" }
title_warn = { fg = "#f5cf73" }
title_error = { fg = "#e5533d" }

[filetype]
rules = [
	{ mime = "image/*", fg = "#f5cf73" },
	{ mime = "{audio,video}/*", fg = "#b48ead" },
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#d2734a" },
	{ mime = "application/{pdf,doc,rtf}", fg = "#8aa6c1" },
	{ mime = "inode/empty", fg = "#6e5b49" },
	{ url = "*", is = "orphan", fg = "#e5533d" },
	{ url = "*", is = "exec", fg = "#a9b665" },
	{ url = "*/", fg = "#7fb4b5", bold = true },
	{ url = "*", fg = "#eedfc4" },
]
