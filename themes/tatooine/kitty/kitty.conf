# Tatooine theme: see ../README.md for the palette

# Font
font_family MesloLGM Nerd Font
font_size   10.5

# Window
window_padding_width    8
background_opacity      0.8
# Lets switch-theme.sh change the opacity of open windows
dynamic_background_opacity yes
confirm_os_window_close 0
enable_audio_bell       no

# Cursor
cursor_blink_interval 0
cursor_trail          3
cursor_trail_decay    0.1 0.3

# Tabs
tab_bar_edge          top
tab_bar_style         powerline
tab_powerline_style   round
tab_title_template    " {index} {title} "
active_tab_foreground   #130e0a
active_tab_background   #f2a65a
active_tab_font_style   bold
inactive_tab_foreground #8c7663
inactive_tab_background #130e0a
tab_bar_background      #130e0a

# Colours: dusk browns, sand and twin-sun accents
foreground           #eedfc4
background           #18120d
selection_foreground none
selection_background #47382b
cursor               #f2a65a
cursor_text_color    #130e0a
url_color            #7fb4b5
active_border_color   #f2a65a
inactive_border_color #372b21
mark1_background     #8aa6c1
mark2_background     #f2a65a
mark3_background     #8aa6c1

color0  #2b221a
color8  #6e5b49
color1  #e5533d
color9  #f0735e
color2  #a9b665
color10 #bcc97a
