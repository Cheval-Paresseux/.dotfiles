# Tatooine theme: see ../README.md for the palette

# General
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 10
set -g focus-events on
set -g set-titles on
set -g set-titles-string "#S: #W"

# Terminal
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-kitty:RGB,*256col*:RGB"

# Splits and new windows keep the current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# Status bar
set -g status-position top
set -g status-interval 30
set -g status-style "bg=#130e0a,fg=#b9a58d"
set -g status-left "#[bold,fg=#130e0a,bg=#f2a65a] #S #[default] "
set -g status-left-length 30
set -g status-right "#[fg=#8c7663]%a %d %b #[fg=#eedfc4,bold]%H:%M "
set -g status-right-length 30

setw -g window-status-format " #I #W "
setw -g window-status-style "fg=#8c7663"
setw -g window-status-current-format " #I #W "
setw -g window-status-current-style "bold,fg=#f2a65a,bg=#2b221a"
setw -g window-status-activity-style "fg=#f5cf73"
setw -g window-status-bell-style "fg=#e5533d"
setw -g window-status-separator ""

# Panes
set -g pane-border-style "fg=#372b21"
set -g pane-active-border-style "fg=#f2a65a"
set -g display-panes-colour "#6e5b49"
set -g display-panes-active-colour "#f2a65a"

# Messages and modes
set -g message-style "bg=#2b221a,fg=#eedfc4"
set -g message-command-style "bg=#2b221a,fg=#f2a65a"
setw -g mode-style "bg=#47382b,fg=#eedfc4"
setw -g clock-mode-colour "#f2a65a"
