# Sex theme: see ../README.md for the palette

# General
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 10
set -g focus-events on
set -g set-titles on
set -g set-titles-string "#S: #W"

# Terminal
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-kitty:RGB,*256col*:RGB"

# Splits and new windows keep the current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# Status bar: slanted cuts, the session in neon, windows set apart by hearts
set -g status-position top
set -g status-interval 30
set -g status-style "bg=#0b0709,fg=#b0909c"
set -g status-left "#[fg=#0b0709,bg=#f03c96,bold] #S #[fg=#f03c96,bg=#0b0709,nobold]#[default] "
set -g status-left-length 30
set -g status-right "#[fg=#7d5868]#(date '+%A %d %B' | tr a-z A-Z) #[fg=#1f1219]#[fg=#f2e4e6,bg=#1f1219,bold,italics] %H:%M "
set -g status-right-length 50

setw -g window-status-format "#[fg=#7d5868,italics]#I #W"
setw -g window-status-current-format "#[fg=#f03c96,bold]#I #W"
setw -g window-status-activity-style "fg=#f2a541"
setw -g window-status-bell-style "fg=#ff4b3a"
setw -g window-status-separator "#[fg=#5c3a4b]  ♥  "

# Panes
set -g pane-border-style "fg=#2a1822"
set -g pane-active-border-style "fg=#f03c96"
set -g pane-border-lines heavy
set -g display-panes-colour "#5c3a4b"
set -g display-panes-active-colour "#f03c96"

# Messages and modes
set -g message-style "bg=#1f1219,fg=#f2e4e6"
set -g message-command-style "bg=#1f1219,fg=#f03c96"
setw -g mode-style "bg=#3a2130,fg=#f2e4e6"
setw -g clock-mode-colour "#f03c96"
