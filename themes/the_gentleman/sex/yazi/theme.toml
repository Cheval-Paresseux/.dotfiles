# Sex theme: black and wine, skin-warm text, neon focus, safeword lights for status (see ../README.md)

[mgr]
cwd = { fg = "#f03c96", bold = true }
find_keyword = { fg = "#f2a541", bold = true }
find_position = { fg = "#7d5868" }
hovered = { bg = "#2a1822" }
hovered_file = { fg = "#f2e4e6", bg = "#2a1822", bold = true }
preview_hovered = { bg = "#2a1822" }
marker_copied = { fg = "#6fd08c", bg = "#6fd08c" }
marker_cut = { fg = "#ff4b3a", bg = "#ff4b3a" }
marker_marked = { fg = "#4fc3d9", bg = "#4fc3d9" }
marker_selected = { fg = "#f03c96", bg = "#f03c96" }
count_copied = { fg = "#0b0709", bg = "#6fd08c" }
count_cut = { fg = "#0b0709", bg = "#ff4b3a" }
count_selected = { fg = "#0b0709", bg = "#f03c96" }
border_symbol = "│"
border_style = { fg = "#2a1822" }

[indicator]
parent = { fg = "#b0909c", bg = "#1f1219" }
current = { fg = "#0b0709", bg = "#f03c96" }
preview = { fg = "#b0909c", bg = "#1f1219" }

[tabs]
active = { fg = "#0b0709", bg = "#f03c96", bold = true }
inactive = { fg = "#7d5868", bg = "#0b0709" }

[mode]
normal_main = { fg = "#0b0709", bg = "#f03c96", bold = true }
normal_alt = { fg = "#f03c96", bg = "#1f1219" }
select_main = { fg = "#0b0709", bg = "#4fc3d9", bold = true }
select_alt = { fg = "#4fc3d9", bg = "#1f1219" }
unset_main = { fg = "#0b0709", bg = "#ff4b3a", bold = true }
unset_alt = { fg = "#ff4b3a", bg = "#1f1219" }

[status]
overall = { fg = "#b0909c" }
perm_type = { fg = "#4fc3d9" }
perm_read = { fg = "#f7a8c8" }
perm_write = { fg = "#ff4b3a" }
perm_exec = { fg = "#6fd08c" }
perm_sep = { fg = "#5c3a4b" }
progress_label = { fg = "#f2e4e6", bold = true }
progress_normal = { fg = "#f03c96", bg = "#1f1219" }
progress_error = { fg = "#ff4b3a", bg = "#1f1219" }

[which]
mask = { bg = "#160d12" }
cand = { fg = "#f03c96" }
rest = { fg = "#7d5868" }
desc = { fg = "#d4b8c0" }
separator_style = { fg = "#5c3a4b" }

[confirm]
border = { fg = "#f03c96" }
title = { fg = "#f03c96", bold = true }
body = { fg = "#d4b8c0" }
btn_yes = { fg = "#0b0709", bg = "#f03c96", bold = true }
btn_no = { fg = "#f2e4e6", bg = "#2a1822" }

[input]
border = { fg = "#f03c96" }
title = { fg = "#f03c96", bold = true }
value = { fg = "#f2e4e6" }
selected = { bg = "#3a2130" }

[pick]
border = { fg = "#f03c96" }
active = { fg = "#f03c96", bg = "#2a1822", bold = true }
inactive = { fg = "#d4b8c0" }

[cmp]
border = { fg = "#3a2130" }
active = { fg = "#f2e4e6", bg = "#2a1822" }
inactive = { fg = "#b0909c" }

[tasks]
border = { fg = "#f03c96" }
title = { fg = "#f03c96", bold = true }
hovered = { fg = "#f2e4e6", bg = "#2a1822" }

[help]
on = { fg = "#f03c96" }
run = { fg = "#4fc3d9" }
desc = { fg = "#b0909c" }
hovered = { bg = "#2a1822", bold = true }
footer = { fg = "#f2e4e6", bg = "#1f1219" }

[notify]
title_info = { fg = "#4fc3d9" }
title_warn = { fg = "#f2a541" }
title_error = { fg = "#ff4b3a" }

[filetype]
rules = [
	{ mime = "image/*", fg = "#f7a8c8" },
	{ mime = "{audio,video}/*", fg = "#9b7cf2" },
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f2a541" },
	{ mime = "application/{pdf,doc,rtf}", fg = "#82d8e8" },
	{ mime = "inode/empty", fg = "#5c3a4b" },
	{ url = "*", is = "orphan", fg = "#ff4b3a" },
	{ url = "*", is = "exec", fg = "#6fd08c" },
	{ url = "*/", fg = "#4fc3d9", bold = true },
	{ url = "*", fg = "#f2e4e6" },
]
