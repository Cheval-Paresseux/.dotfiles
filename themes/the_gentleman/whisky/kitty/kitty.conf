# Whisky theme: see ../README.md for the palette

# Font
font_family MesloLGM Nerd Font
font_size   10.5

# Window
window_padding_width    10
background_opacity      0.9
# Lets switch-theme.sh change the opacity of open windows
dynamic_background_opacity yes
confirm_os_window_close 0
enable_audio_bell       no

# Cursor
cursor_blink_interval 0

# Tabs: quiet labels set apart by brass fleurons, the current one in amber italics
tab_bar_edge          top
tab_bar_style         separator
tab_separator         "  ❦  "
tab_title_template    "{index} {title}"
active_tab_foreground   #e3a14e
active_tab_background   #110d0a
active_tab_font_style   bold-italic
inactive_tab_foreground #7a6652
inactive_tab_background #110d0a
inactive_tab_font_style normal
tab_bar_background      #110d0a
tab_bar_margin_height   4 4

# Colours: tobacco darks, cream text, amber whisky, velvet, smoke, ember and wine
foreground           #eadcc2
background           #110d0a
selection_foreground none
selection_background #382b20
cursor               #e3a14e
cursor_text_color    #0c0907
url_color            #8da4bf
active_border_color   #e3a14e
inactive_border_color #2a2119
mark1_background     #8da4bf
mark2_background     #e3a14e
mark3_background     #c9849b

color0  #201913
color8  #5a4838
color1  #c94a52
color9  #dc6b71
color2  #7aa874
color10 #98c290
color3  #e3a14e
color11 #f2c37d
color4  #8da4bf
color12 #a9bdd3
color5  #c9849b
