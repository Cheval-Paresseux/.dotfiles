# Whisky theme: see ../README.md for the palette

# Font
font_family MesloLGM Nerd Font
font_size   10.5

# Window
window_padding_width    10
background_opacity      0.9
# Lets switch-theme.sh change the opacity of open windows
dynamic_background_opacity yes
confirm_os_window_close 0
enable_audio_bell       no

# Cursor
cursor_blink_interval 0

# Tabs: quiet labels set apart by gilt fleurons, the current one in gold italics
tab_bar_edge          top
tab_bar_style         separator
tab_separator         "  ❦  "
tab_title_template    "{index} {title}"
active_tab_foreground   #c8a96a
active_tab_background   #0e1210
active_tab_font_style   bold-italic
inactive_tab_foreground #66716a
inactive_tab_background #0e1210
inactive_tab_font_style normal
tab_bar_background      #0e1210
tab_bar_margin_height   4 4

# Colours: bottle-green darks, ivory text, antique gold, sage, slate, cognac and claret
foreground           #e4dcc8
background           #0e1210
selection_foreground none
selection_background #2a372e
cursor               #c8a96a
cursor_text_color    #0a0d0b
url_color            #8b9cab
active_border_color   #c8a96a
inactive_border_color #1f2a23
mark1_background     #8b9cab
mark2_background     #c8a96a
mark3_background     #9c7f9a

color0  #18201b
color8  #45524a
color1  #b24a4f
color9  #c96a6c
color2  #88a878
color10 #a3bf93
