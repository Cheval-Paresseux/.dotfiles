# Whisky theme: see ../README.md for the palette

# General
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 10
set -g focus-events on
set -g set-titles on
set -g set-titles-string "#S: #W"

# Terminal
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-kitty:RGB,*256col*:RGB"

# Splits and new windows keep the current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# Status bar: the session on an amber label, windows separated by brass fleurons
set -g status-position top
set -g status-interval 30
set -g status-style "bg=#0c0907,fg=#a8957d"
set -g status-left "#[fg=#0c0907,bg=#e3a14e,bold] #S #[fg=#e3a14e,bg=#0c0907,nobold]#[default]  "
set -g status-left-length 30
set -g status-right "#[fg=#7a6652,italics]%A %d %B #[fg=#9a7038,noitalics]❦ #[fg=#f2c37d,bold]%H:%M "
set -g status-right-length 40

setw -g window-status-format "#[fg=#7a6652]#I #W"
setw -g window-status-current-format "#[fg=#e3a14e,bold,italics]#I #W"
setw -g window-status-activity-style "fg=#e8743c"
setw -g window-status-bell-style "fg=#c94a52"
setw -g window-status-separator "#[fg=#5a4838]  ❦  "

# Panes
set -g pane-border-style "fg=#2a2119"
set -g pane-active-border-style "fg=#e3a14e"
set -g pane-border-lines heavy
set -g display-panes-colour "#5a4838"
set -g display-panes-active-colour "#e3a14e"

# Messages and modes
set -g message-style "bg=#201913,fg=#eadcc2"
set -g message-command-style "bg=#201913,fg=#e3a14e"
setw -g mode-style "bg=#382b20,fg=#eadcc2"
setw -g clock-mode-colour "#e3a14e"
